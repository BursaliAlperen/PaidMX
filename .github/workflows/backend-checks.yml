name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/backend-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run check
